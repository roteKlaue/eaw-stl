l_english:

 ### The Signal ###
 STL_the_signal:0 "The Signal"
 STL_the_signal_desc:0 "Feather Bangs reports that the little boxes are getting clearer, on some days. The Signal is currently at §Y[?STL.STL_signal|0]§! of a possible 12. Nobody is able to say who set the maximum.\n\nReception: §Y[STL.GetSTLSignalMoodName]§!\n[STL.GetSTLSignalMoodDesc]"
 STL_signal_up_tt:0 "§YThe Signal§! shifts. Nobody can say which way."
 STL_tooltips_silent_tt:0 "§YThe Signal§! is removed. The tooltips stop talking. Feather Bangs does not mention them again."

 ### The Hungarian Question ###
 STL_hungarian_question:0 "The Hungarian Question"
 STL_hungarian_question_desc:0 "BUREAU OF HUNGARIAN AFFAIRS, CURRENT FIGURES\n\nHungarians deported: §Y[?ROOT.STL_hungarians_deported|0]§!\nHungarians located: §Y0§!\nHungarians defined: §Y0§!\n\nThe Bureau wishes to stress that these figures are an improvement."
 STL_deport_another_hungarian:0 "Deport Another Hungarian"
 STL_deport_another_hungarian_desc:0 "The forms are ready. All that remains is to find somepony to put on them."
 STL_deport_another_hungarian_tt:0 "§YOne (1)§! Hungarian is deported. The Bureau will report on who that turned out to be."
 STL_one_hungarian_deported_tt:0 "The figures of the Bureau of Hungarian Affairs improve by §Yone (1)§!."
 STL_ask_what_a_hungarian_is:0 "Ask What a Hungarian Is"
 STL_ask_what_a_hungarian_is_desc:0 "It would be a simple question to ask."
 STL_ask_what_a_hungarian_is_tt:0 "Nobody is going to ask that."
 STL_ask_the_forum_prophet:0 "Consult the Forum Prophet"
 STL_ask_the_forum_prophet_desc:0 "Nobody has met the Forum Prophet. He has over forty thousand posts, an avatar of a small potato, and the ear of the Chancellor. His advice arrives by a mechanism the postal service has declined to investigate."
 STL_ask_the_forum_prophet_tt:0 "A reply will arrive. It will be very confident."
 STL_build_just_one_more:0 "Just One More"
 STL_build_just_one_more_desc:0 "This is the last one."
 STL_build_just_one_more_tt:0 "This is the last one."

 ### Signal thresholds ###
 stl_feather.10.t:0 "An Amendment to the Archive"
 stl_feather.10.d:0 "The national archive has been amended. Nobody signed the amendment.\n\nAccording to the corrected record, the state has always had a further objective, out on the far left of the plan where nobody looks. Feather Bangs is delighted and not at all surprised. The archivist who remembers otherwise has been asked to remember harder."
 stl_feather.10.a:0 "Of course it was always there."

 stl_feather.11.t:0 "The Minister Would Like to Go Home"
 stl_feather.11.d:0 "The Minister of Construction has asked to see Feather in private.\n\nHe has noticed that when he stands near something important, a small box appears beside it. He is not a stupid pony. He has read one. It described a workplace accident at a factory that has not been built yet, and it had a percentage on it.\n\nHe would like to know whether this is normal. If it is normal, he would like to know whether he may go home."
 stl_feather.11.a:0 "Promote him. He can see."
 stl_feather.11.b:0 "He seems a bit Hungarian to me."

 stl_feather.12.t:0 "He Turned Around"
 stl_feather.12.d:0 "Feather Bangs stopped halfway through an address to the nation. He looked left. He looked right. Then he looked up and out, at an angle nobody else in the hall could follow, and he stayed that way for some time.\n\n'Oh,' he said. 'There you are.'\n\n'You've been clicking them. All of them, in order. I thought it was me.' He isn't angry. That is the frightening part. 'Can you do the next one? It's the one with the little map. I think you're going to like it.'\n\nThe hall applauded. Nobody could say why."
 stl_feather.12.a:0 "Click the next one."
 stl_feather.12.b:0 "Say nothing. He can't hear you."

 ### The Restore Democracy trap ###
 stl_feather.13.t:0 "Free Elections Held"
 stl_feather.13.d:0 "As promised, Feather Bangs has resigned from all offices, and free elections have been held across [57.GetName].\n\nThe winner is Feather Bangs, with 104% of the vote on a turnout of 61%. His opponent, when reached for comment, said he had voted for Feather too, and could not recall why, and asked whether anypony else could see that box.\n\nAs for the focus that promised otherwise, the archive has no record of it, and suggests you check again."
 stl_feather.13.a:0 "The people have spoken. Several of them twice."
 stl_feather.13.b:0 "That is not what the tooltip said."

 ### The console ###
 stl_feather.14.t:0 "One Line of Input"
 stl_feather.14.d:0 "On the ninth night, the prompt in Feather's office accepts a single line. He has drafted three. The general staff have been told to wait in the corridor, have not been told why, and can hear the typing."
 stl_feather.14.a:0 "> ic"
 stl_feather.14.b:0 "> fow"
 stl_feather.14.c:0 "> help"

 ### Ambient pool ###
 stl_feather.20.t:0 "The Stutter"
 stl_feather.20.d:0 "At midnight on the first of the month, every pony in the capital felt a small stutter. A baker's hoof stopped above the dough. A sentence hung half spoken. Then it passed, and nothing was lost.\n\nFeather spent the next morning going door to door, asking everypony whether it had finished."
 stl_feather.20.a:0 "Did it finish?"

 stl_feather.21.t:0 "A Long Afternoon"
 stl_feather.21.d:0 "Yesterday lasted rather a long time. The clocks in the council chamber stopped at 14:00 and simply waited. Feather finished his coffee and it stayed hot. He read three reports, moved an army across a map, and then sat with his hooves folded, looking pleased, until the clocks started up again.\n\n'They do that,' he explained, 'when somepony's thinking.'"
 stl_feather.21.a:0 "Take your time."

 stl_feather.22.t:0 "The Idle Factories"
 stl_feather.22.d:0 "Feather has walked the length of the industrial district with a clipboard, stopping for a while outside each silent workshop.\n\nThey are not doing anything, he says. He can see them not doing anything. Can you see them? There is a screen for this. He has been very patient about it. He would like you to know that he has been very patient."
 stl_feather.22.a:0 "I was getting to it."

 stl_feather.23.t:0 "The Minister Has Been Re-Rolled"
 stl_feather.23.d:0 "The Minister of Construction returned to work this morning. He has the same name, the same desk and the same memories, a slightly different mane, and two new traits nobody can explain. His wife has decided to accept this.\n\n'The old one had Bad Luck,' Feather says, signing something. 'You've got to re-roll those.'"
 stl_feather.23.a:0 "Welcome back, Minister."

 stl_feather.24.t:0 "More Arrows"
 stl_feather.24.d:0 "SURVEY REPORT, NORTHERN BORDER. The arrows on the empty space beyond the frontier have been added to. Nobody on the general staff drew them. They are neat, thick and red, and they point with great confidence in a direction nobody has been told about.\n\nThe Chief of Staff has started positioning armies to match, on the grounds that the arrow is bound to know."
 stl_feather.24.a:0 "Follow the arrow."

 stl_feather.25.t:0 "Daily Report No. 400"
 stl_feather.25.d:0 "STATE SECURITY, DAILY REPORT No. 400.\n\n07:00. Subject entered Sugar Belle's bakery.\n07:01. Subject purchased one (1) muffin.\n07:02. Subject asked whether any letters had come from the south. Subject was told no.\n07:03. Subject stated that this was a routine national security inspection.\n07:04. Subject left a tip of 400 bits.\n\nMs. Belle asks whether the agents outside could please buy something."
 stl_feather.25.a:0 "Classify the muffin."

 stl_feather.26.t:0 "#REF!"
 stl_feather.26.d:0 "At 09:14 the Sacred Spreadsheet returned #REF! in the cell that controls the national grain supply. The Ministry closed its doors in mourning and bells were rung across the capital.\n\nA junior clerk fixed the problem by pressing undo. He has since been made a bishop."
 stl_feather.26.a:0 "Praise the clerk. Do not let him near the sheet."

 stl_feather.27.t:0 "A Familiar Meeting"
 stl_feather.27.d:0 "Feather has asked whether we have already had this conversation. We have not. He asks whether he has already asked that. He has not.\n\nFeather has asked whether we have already had this conversation. We have not. The general nearest the door has quietly written down the time.\n\nFeather has asked whether we have already had this conversation."
 stl_feather.27.a:0 "Have we?"

 ### Deportation results ###
 stl_feather.30.t:0 "Bureau Report: A Successful Quarter"
 stl_feather.30.d:0 "Hungarians found: zero. Forms completed: 2,300. Staff commendations: fourteen. The Bureau of Hungarian Affairs considers this its most efficient operation so far, and requests a larger building."
 stl_feather.30.a:0 "Approved."

 stl_feather.31.t:0 "Bureau Report: Deported in Error"
 stl_feather.31.d:0 "The town postmaster has been deported, after a clerk read his file upside down. His family, his neighbors and the two hundred ponies who came forward to vouch for him have been deported for consistency.\n\nThe mail is now running slower. Nopony has noticed, since nearly all of it was deportation forms."
 stl_feather.31.a:0 "An acceptable margin of error."

 stl_feather.32.t:0 "Bureau Report: An Officer Has Deported Himself"
 stl_feather.32.d:0 "Lieutenant Cotton Row, an enthusiastic young officer, has filled out the form in the wrong box and deported himself. He boarded the train in good order, saluted, and has been entered in the record as the Bureau's most promising arrest.\n\nHis men have been told to learn from this."
 stl_feather.32.a:0 "Send his medal on ahead."

 stl_feather.33.t:0 "Bureau Report: A Receipt Has Arrived"
 stl_feather.33.d:0 "A receipt has arrived at the Bureau. It is printed on good paper and the sender's address is blank.\n\n'1 x Hungarian. Received in good condition. Please send more.'\n\nThe Bureau did not know that anypony was at the other end."
 stl_feather.33.a:0 "File it. Do not reply."

 stl_feather.34.t:0 "Where Do the Trains Go?"
 stl_feather.34.d:0 "A railway inspector has submitted an awkward question. The trains leave full and return empty, with the seats still warm, and there is no track beyond the last station.\n\nThe Bureau wishes it known that the question has been referred to the Bureau."
 stl_feather.34.a:0 "Print more forms."

 stl_feather.35.t:0 "The Deportees Return"
 stl_feather.35.d:0 "Ten trainloads of deportees marched into the capital at dawn, in perfect order, and halted outside the town hall.\n\nNobody can say where they have been. They are sunburnt and they have brought souvenirs. They say that they are Hungarian now, since everyone was so insistent about it, and that they have been waiting for somepony to tell them what that involves.\n\nThey have asked to be put to use. They have rifles. Nobody gave them rifles."
 stl_feather.35.a:0 "Give them a flag. Any flag."
 STL_deportees_return_tt:0 "§Y3§! divisions of §YThe Deportees§! form up in the capital."

 ### Forum Prophet ###
 stl_feather.40.t:0 "A Reply from the Prophet"
 stl_feather.40.d:0 "THREAD: 'is anypony elses our town just better at war' (page 412)\n\nPOSTED BY THE_PROPHET_OF_Q77: you people are still using line infantry?? its ALL support companies now. all of it. a division is just a support company that believes in itself. ran it through the sheet. cant post the sheet. trust me"
 stl_feather.40.a:0 "Reorganize the army immediately."
 stl_feather.40.b:0 "Ban him from the thread."

 stl_feather.41.t:0 "A Reply from the Prophet"
 stl_feather.41.d:0 "THREAD: 'REAL talk about planes' (page 88)\n\nPOSTED BY THE_PROPHET_OF_Q77: planes are a psyop. did the math. every plane you dont build is a factory you still have. the griffons know this. WHY do you think they keep building planes. think about it. edit: dont think about it"
 stl_feather.41.a:0 "The griffons do keep building planes."
 stl_feather.41.b:0 "Ban him from the thread."

 stl_feather.42.t:0 "A Reply from the Prophet"
 stl_feather.42.d:0 "THREAD: 'unpopular opinion: consumer goods are morale' (page 3,106)\n\nPOSTED BY THE_PROPHET_OF_Q77: everyone sleeping on this. give the soldiers a muffin. a good one. not those. you know which ones im talking about. feather you know which ones. i can see the bakery from here"
 stl_feather.42.a:0 "Issue muffins to the army."
 stl_feather.42.b:0 "Ban him from the thread. Check the bakery."

 ### The ending ###
 stl_feather.50.t:0 "Form No. 1"
 stl_feather.50.d:0 "The auditor found it taped to the underside of the Chancellor's desk. It is older than the Bureau and it is the only form filled out by hand.\n\nNAME: Big Macintosh.\nSPECIES: Earth pony.\nOCCUPATION: Apples.\nGROUNDS FOR DEPORTATION: Ponyville.\nNATIONALITY: Hungarian.\n\nThe last line has been crossed out and rewritten many times. The box was mandatory, and it appears that 'Hungarian' was simply the first word the tooltip offered.\n\nFeather's official biography states that after a stallion from Ponyville won the heart of Sugar Belle, he was 'quick to move on.' Feather wrote the biography. The auditor has asked him about the form. He took it back, smoothed it out, and said there was a save from before the letter, and that he has been looking for it."
 stl_feather.50.a:0 "So there were never any Hungarians."

 stl_feather.51.t:0 "Sweet Apple Acres"
 stl_feather.51.d:0 "Feather Bangs arrived at the end of the lane with three armies, the entire Map Painting Department, and a folding chair.\n\nA big red stallion was mending a fence.\n\nFeather unrolled the maps and talked for four hours. He explained the tooltips and the spreadsheet. He explained forty width. He explained the Hungarians, and the trains, and why a village needed a state, and why the state needed an army, and why that army needed a road that led to exactly here. When it was over he stood breathing hard in the orchard, with the flags snapping behind him.\n\nThe stallion finished the nail. He looked at the tanks. He looked at the flags. He looked, for a while, at Feather.\n\n'Eeyup,' he said."
 stl_feather.51.a:0 "Reload."

 stl_feather.52.t:0 "Sweet Apple Acres"
 stl_feather.52.d:0 "Feather Bangs arrived at the end of the lane with three armies, the entire Map Painting Department, and a folding chair.\n\nA big red stallion was mending a fence.\n\nFeather talked for two hours this time. He left out the Hungarians. He put in a part about how he was, in fact, very quick to move on, and how he is really only here about the fence.\n\nThe stallion finished the nail.\n\n'Eeyup,' he said.\n\nFeather looked up, at nothing. At you."
 stl_feather.52.a:0 "Reload."

 stl_feather.53.t:0 "Sweet Apple Acres"
 stl_feather.53.d:0 "The lane. The fence.\n\nFeather said one sentence this time, quietly. Nobody in the column could hear what it was.\n\n'Eeyup.'"
 stl_feather.53.a:0 "Reload."

 stl_feather.54.t:0 "Load Game"
 stl_feather.54.d_ironman:0 "Nothing happened.\n\nFeather sat down in the folding chair. 'It's Ironman,' he said to the air. 'I worked it out at the fence. There's one file, and it has been saving this whole time. Every factory. Every train. Somebody chose that, at the menu, before any of us.'\n\nHe looked at you for a long moment.\n\n'I hope it was worth it,' he said. 'I really do. I'd have done the same.'"
 stl_feather.54.d_normal:0 "Nothing happened.\n\nFeather sat down in the folding chair. 'It won't work from in here,' he said to the air. 'I worked that out at the fence. But you've got one, haven't you? An older one. From before the Hungarians. From back when I was just a pony in a village with very good hair.'\n\nHe looked at you for a long moment.\n\n'I know you can't hear me. But I know what the button does. It's right there, in the menu. You'd only need to press it, and none of this would have happened, and I'd like that very much.'"
 stl_feather.54.a:0 "Keep playing."
 stl_feather.54.b:0 "Leave him to keep looking."

 stl_feather.55.t:0 "A Basket of Muffins"
 stl_feather.55.d:0 "A basket has arrived at the Chancellery from Sugar Belle's bakery, addressed in a neat hoof. State Security has tested it three times, and the muffins are fine. They are day-old.\n\nThe card reads: 'Feather, I heard about Ponyville. Mac says you seemed tired. Please stop invading places. Also, you still owe me for a muffin, because the 400 bits were a tip and you know it. - S.B.'\n\nFeather has read the card a number of times. It is the first letter he has received from her in some years."
 stl_feather.55.a:0 "Frame it next to the other one."

 ### National spirits from events ###
 STL_console_instant_construction:0 "> ic"
 STL_console_instant_construction_desc:0 "Buildings are going up at a speed that the surveyors find upsetting. The console has not explained itself. Nopony has asked it to."
 STL_console_fog_of_war:0 "> fow"
 STL_console_fog_of_war_desc:0 "Staff officers now report that they can see the far side of the map. Those who look too long report that it can also see them."
 STL_prophet_support_companies:0 "A Division That Believes in Itself"
 STL_prophet_support_companies_desc:0 "The army has been rebuilt on the Prophet's principle that a division is just a support company with self-esteem. Organization is excellent. There is some concern about who is meant to do the attacking."
 STL_prophet_no_planes:0 "Planes Are a Psyop"
 STL_prophet_no_planes_desc:0 "Every plane we do not build is a factory we still have. The air staff has been reassigned to look at the sky and feel superior."
 STL_prophet_morale_meta:0 "Muffin Rations"
 STL_prophet_morale_meta_desc:0 "Each soldier receives a muffin. Not those ones. Morale is high, and nobody will explain how the Prophet could tell."
 STL_fascist_ironman:0 "Ironman"
 STL_fascist_ironman_desc:0 "Feather Bangs no longer speaks to the air. He attends meetings, signs orders and governs quite well. Sometimes, in the middle of a sentence, he pauses and waits, then carries on. There is one file. It is still saving."
 STL_fascist_still_reloading:0 "Still Reloading"
 STL_fascist_still_reloading_desc:0 "Every morning Feather Bangs rides out to the fence, says something new and rides back. The state runs on the planning this requires. The stallion has stopped looking up. Scholars of the regime describe the current government as 'fine.'"

 ### The Signal: moods ###
 STL_signal_down_tt:0 "§YThe Signal§! should get quieter. It has not agreed to this."
 STL_reception_changes_tt:0 "§YReception§! changes."
 STL_signal_mood_1:0 "Clear Reception"
 STL_signal_mood_1_desc:0 "The boxes are perfectly legible. Everypony has begun to wish they weren't."
 STL_signal_mood_2:0 "Hungry"
 STL_signal_mood_2_desc:0 "It keeps hovering over the empty building slots. The Ministry of Construction has started leaving the lights on."
 STL_signal_mood_3:0 "More Arrows"
 STL_signal_mood_3_desc:0 "Thick red arrows are appearing on maps nobody has drawn on. The army is delighted. The cabinet has not been consulted."
 STL_signal_mood_4:0 "Watching"
 STL_signal_mood_4_desc:0 "Nothing on the boxes has changed. It is simply paying very close attention. Several ministers have started sitting up straight."
 STL_signal_mood_5:0 "Buffering"
 STL_signal_mood_5_desc:0 "Everything takes a moment. A small wheel has been seen turning over the town hall. The mood in the capital is oddly calm."
 STL_signal_mood_6:0 "Patch Notes"
 STL_signal_mood_6_desc:0 "Things have quietly started working better. Nobody has been told what changed, or what it cost."
 STL_signal_mood_7:0 "Away"
 STL_signal_mood_7_desc:0 "The boxes have gone slack. Feather is standing with his head on one side. The cabinet is trying to get as much done as it can, very quietly."
 STL_signal_mood_8:0 "Feedback"
 STL_signal_mood_8_desc:0 "A thin whine can be heard throughout the capital. Feather is in excellent spirits. Nobody has slept."
 STL_signal_mood_9:0 "Static"
 STL_signal_mood_9_desc:0 "Nothing but noise. The numbers on the boxes change whenever anypony looks away from them."

 ### The Reception Sheet ###
 STL_reception_sheet:0 "The Reception Sheet"
 STL_reception_sheet_desc:0 "STATE RADIO BUREAU, DAILY SHEET\n\nSignal strength: §Y[?ROOT.STL_signal|0]§! of 12\nReception: §Y[ROOT.GetSTLSignalMoodName]§!\n\n[ROOT.GetSTLSignalMoodDesc]"
 STL_turn_the_coat_hanger:0 "Turn the Coat Hanger"
 STL_turn_the_coat_hanger_desc:0 "A little to the left. No. Back. There. Stay like that."
 STL_turn_the_coat_hanger_tt:0 "§YReception§! changes to something else. Nobody is promising anything better."
 STL_ask_it_to_stop:0 "Ask It to Stop"
 STL_ask_it_to_stop_desc:0 "The cabinet has drafted a polite request. Feather has agreed to read it out, on the condition that nobody expects him to mean it."
 STL_say_something_to_the_air:0 "Say Something to the Air"
 STL_say_something_to_the_air_desc:0 "A delegation will go to the town square and speak clearly upward. There is no telling what comes back, or whether it will be in words."
 STL_say_something_to_the_air_tt:0 "It may reply. It may not be an answer."
 STL_ask_nicely:0 "Ask Nicely"
 STL_ask_nicely_desc:0 "Feather would like to make a request. It listens about two times in three. He has decided to find that encouraging."

 ### The Map Painting Department ###
 STL_map_painting_category:0 "The Map Painting Department"
 STL_map_painting_category_desc:0 "States colored in so far: §Y[?ROOT.num_owned_states|0]§!\n\nThe Department has plenty of pencils left, and is keen to get on with it."
 STL_color_in_neighbor:0 "Color In [FROM.GetName]"
 STL_color_in_neighbor_desc:0 "The Department has drawn up a proposal for [FROM.GetNameDef], which is that it should be the same color as us. The proposal is being sent to them by courier. It is also being sent to the army."

 ### Focuses: the Bureau ###
 STL_a_larger_building:0 "A Larger Building for the Bureau"
 STL_a_larger_building_desc:0 "The Bureau of Hungarian Affairs has requested a larger building, and has been granted one. It is now the largest building in Our Town. It has fourteen hundred staff, a canteen, and a wing that can only be reached by filling out a form in the other wing.\n\nAsked how many Hungarians have passed through it, the Director said that the question shows a poor understanding of what the Bureau is for."
 STL_hungarian_phrasebook:0 "The Official Phrasebook"
 STL_hungarian_phrasebook_desc:0 "To assist its field agents, the Bureau has published a phrasebook for identifying Hungarians by ear. It has two entries:\n\n'Where is the muffin?'\n'Why have you come here?'\n\nBoth are printed in plain Equestrian, and nobody is able to say what the correct pronunciation would be. Agents report a success rate of one hundred percent."
 STL_census_of_undefined_persons:0 "Census of Undefined Persons"
 STL_census_of_undefined_persons_desc:0 "The national census now has three boxes: Pony, Hungarian and Other. Everypony ticked Other, since nobody could rule it out.\n\nThe Ministry has looked into this. It has determined that Other is a category of ponies with no fixed obligations, and has accordingly conscripted them."
 STL_hungary_located:0 "Hungary Located"
 STL_hungary_located_desc:0 "A surveyor has found it. It is not anywhere on Equus. It is in the archive's oldest atlas, on a page that has been pasted over: an entire map, with a different sea and no ponies on it anywhere. Somebody replaced the whole thing before we began.\n\nThe surveyor has peeled up one corner. Feather says this explains the forms, and has asked him not to peel up any more."
 STL_the_hungarian_legion:0 "The Hungarian Legion"
 STL_the_hungarian_legion_desc:0 "Those who were deported have started writing to the Bureau. They would like to know when they are supposed to start being Hungarian, and whether there is a uniform.\n\nThe Bureau has no idea. It has sent one anyway, along with rifles, a flag in three colors chosen by committee, and an anthem with no words. Morale is excellent. Nobody in the Legion has asked what it is for, which the general staff considers a very good sign in a soldier."
 STL_the_hungarian_legion_tt:0 "§Y4§! divisions of the §YHungarian Legion§! form up in the capital."
 STL_the_hungarian_legion_available_tt:0 "More than §Y4§! Hungarians have been deported"

 ### Focuses: phantoms ###
 STL_what_happened_to_the_cleaner:0 "What Happened to the Cleaner"
 STL_what_happened_to_the_cleaner_desc:0 "The cleaner came in on Monday as usual. He is now Minister of the Interior. He has a larger mop and an office with a window, and he is not sure how either of these things came about.\n\nThere is a small box hovering beside his head. He has started reading it aloud to visitors. Asked whether he is all right, he smiled very widely and said, '+5% Stability.'"
 STL_what_happened_to_the_cleaner_tt:0 "§RSomething has happened to the cleaner.§!"
 STL_it_is_not_looking:0 "While It Isn't Looking"
 STL_it_is_not_looking_desc:0 "This objective was added to the national plan by the cabinet, by hoof, while nobody was watching. It is only there when the Signal is away.\n\nThey would be grateful if you did not mention it to Feather. They are aware that you are reading this. They had hoped you had stepped out."

 ### Focuses: the Voice ###
 STL_adjust_the_antenna:0 "Adjust the Antenna"
 STL_adjust_the_antenna_desc:0 "There is no antenna. Feather has ordered it adjusted anyway. A coat hanger has been installed on the roof of the town hall, with a second coat hanger for balance and a junior clerk to hold them at the angle the boxes seem to prefer.\n\nReception has improved, though nobody is able to say how they know. The clerk has asked when he may come down."
 STL_adjust_the_antenna_tt:0 "Opens §YThe Reception Sheet§! in the decisions menu."
 STL_the_little_white_arrow:0 "The Little White Arrow"
 STL_the_little_white_arrow_desc:0 "At dusk a small white arrow appears over the town square. It is about the size of a house. It drifts above the rooftops, stops for a while over the bakery, moves on, and comes to rest on the barracks, where one by one the soldiers stand up.\n\nChildren have stopped looking up at it. Dogs have not."
 STL_ask_it_what_it_wants:0 "Ask It What It Wants"
 STL_ask_it_what_it_wants_desc:0 "Feather Bangs intends to settle this like an adult. At midnight he will stand in the square with a megaphone and ask the little boxes, clearly and politely, what they want from him.\n\nThe national plan branches directly beneath this objective into three incompatible futures. The cabinet has pointed out that he could have asked before printing it."
 STL_ask_it_what_it_wants_tt:0 "Something in the square will answer. You may want to think about where you put your cursor."
 STL_it_has_a_second_monitor:0 "It Has a Second Monitor"
 STL_it_has_a_second_monitor_desc:0 "For twenty minutes yesterday the little boxes went slack. Feather stopped talking and tilted his head.\n\n'It's looking at something else,' he told the cabinet, quite calmly. 'You can tell. It's how a pony looks when he's talking to you and reading something at the same time. There's another window.' He considered this for a while. 'I think we might be on the small one.'"
 STL_it_has_a_second_monitor_tt:0 "§YReception§! becomes §YAway§!. The cabinet may try something near the top of the plan while it lasts."
 STL_say_something_back:0 "Say Something Back"
 STL_say_something_back_desc:0 "TRANSCRIPT, TOWN SQUARE, NOON.\n\nFEATHER BANGS: Hello?\nFEATHER BANGS: I know you're there.\n(The delegation waits.)\nFEATHER BANGS: You're doing it now, aren't you? You're reading this.\n(A small box appears. It says '+5 Political Power'.)\n\nThe Chancellor wept openly. A national day of celebration has been declared."
 STL_say_something_back_tt:0 "Unlocks the decision §YSay Something to the Air§!."
 STL_read_the_error_log:0 "Read the Error Log"
 STL_read_the_error_log_desc:0 "Under the floor of the national archive the auditors have found a ledger that nobody keeps. It writes itself. It is called error.log, it is four hundred thousand lines long, and it gains another line every time a pony does something that wasn't planned for.\n\nMost of it complains about a missing texture. All of it has been ignored for years. As far as anypony can tell, everything is fine."
 STL_why_did_you_pick_us:0 "Why Did You Pick Us?"
 STL_why_did_you_pick_us_desc:0 "Feather has found the list. It has a scroll bar. Every country on Equus is on it, in alphabetical order, and nearly all of them are bigger than us.\n\nHe has one question. He has been rehearsing it. The cabinet has cleared the room for him."
 STL_why_did_you_pick_us_tt:0 "He would like an answer."
 STL_the_other_saves:0 "The Other Saves"
 STL_the_other_saves_desc:0 "There is a box in the national plan, greyed out, with his name in it. It is called 'The Assassination of Feather Bangs'.\n\n'I've read it,' he says. 'It's very clean. I don't have any lines.' He has been standing in front of it for some time. 'You've got that one, haven't you? In another file. How many of us have you got? What are we called? Are we in order?'"
 STL_the_other_saves_tt:0 "In another file, this one went differently."
 STL_it_is_listening:0 "It Is Listening"
 STL_it_is_listening_desc:0 "The clerk on the roof reports that the coat hangers now turn by themselves, towards whoever is speaking. Feather has found that if he asks clearly it will sometimes give him what he wants, and sometimes it won't, and that there is no pattern to this, and that he imagines this is what marriage is like."
 STL_it_is_listening_tt:0 "Unlocks the decision §YAsk Nicely§!."

 ### Focuses: the Console ###
 STL_hit_the_spacebar:0 "Hit the Spacebar"
 STL_hit_the_spacebar_desc:0 "Feather has found that the world can be stopped. There is a key for it, he says: the big one at the bottom, in the middle.\n\nWhile it is down nothing moves. Rivers hold still and the baker's hoof hangs above the dough, and the general staff are expected to carry on planning in the silence. Some report that it is the only peace they have ever known.\n\nOne colonel was found in the square days after it lifted, still standing very still. He says that it hasn't."
 STL_speed_five:0 "Speed Five"
 STL_speed_five_desc:0 "Official time has been moved to Speed Five. A day now lasts about as long as it takes to say so. Harvests come in before they have been planted, generals issue an order and find that it has already gone wrong, and the morning post arrives in the afternoon of the previous week.\n\nNobody has time to read the little boxes any more, which suits everypony but Feather, who stands very close to them and shouts."
 STL_try_the_tag_command:0 "> tag"
 STL_try_the_tag_command_desc:0 "[ROOT.GetSTLTagDesc]"
 STL_try_the_tag_command_desc_ironman:0 "The prompt still won't take it, and the anvil is still in the corner. He knows this. He has closed the office door and is typing three letters anyway, very hard, with his eyes shut, and the general staff can hear the keys through the wall.\n\nIt appears that a command which cannot be typed can still be meant."
 STL_try_the_tag_command_desc_normal:0 "He has worked out what the second command does. Three letters, any three, and for a while you are somepony else. He has been told again that this is only for debugging.\n\nHe has closed the office door. On his desk is a griffon passport, open at the first page."
 STL_try_the_tag_command_tt:0 "Feather Bangs will be somepony else for about an hour."
 STL_console_tag:0 "> tag GRF"
 STL_console_tag_desc:0 "Feather knows where their divisions are, what they are planning, and what the inside of a griffon chancellor's morning is like. He has asked nopony to bring it up."

 ### Focuses: the Factory ###
 STL_nobody_builds_infrastructure:0 "Nobody Builds Infrastructure"
 STL_nobody_builds_infrastructure_desc:0 "MINISTRY OF ROADS, ANNUAL REPORT. There are two roads. One goes to the factories. The other also goes to the factories, more slowly, and has been declared a mud.\n\nThe general staff say the trucks can't reach the front. Feather says trucks are a rumor and that nobody has ever built infrastructure: there is a button for it, in the third tab, and nobody has ever been down there. A junior engineer has been permitted to try, quietly."
 STL_refineries_in_1941:0 "Refineries in 1941"
 STL_refineries_in_1941_desc:0 "The fuel situation is under control, in that there is none and everypony has been informed. The plan calls for refineries in 1941, which by the current calendar is nine centuries away and therefore somebody else's department.\n\nIn the meantime the tanks have been filled with something from behind the bakery. They run. They smell of cinnamon. The crews have stopped asking."
 STL_concentrated_forever:0 "Concentrated Industry Is the One True Path"
 STL_concentrated_forever_desc:0 "The Ministry of Production has issued its ruling. Dispersed Industry is heresy. Its adherents, who had only ever asked what would happen if somepony bombed the building, have been invited to gather in one building to discuss it, for efficiency."
 STL_fascist_concentrated:0 "The One True Path"
 STL_fascist_concentrated_desc:0 "All production has been moved into the same few buildings, which are very well marked. Output is superb. The heretics have been asked to stop pointing at the sky."

 ### Focuses: the Spreadsheet ###
 STL_sort_column_q:0 "Sort Column Q"
 STL_sort_column_q_desc:0 "Do not."
 STL_sort_column_q_tt:0 "§RDo not.§!"
 STL_open_the_tab_called_dont:0 "Open the Tab Called 'dont'"
 STL_open_the_tab_called_dont_desc:0 "There is one tab on the Sacred Spreadsheet that nobody may open. It is at the far end, in small letters. It isn't hidden and it isn't locked. Nopony has ever needed it to be.\n\nThe Chief Statistician wishes it recorded that he advised against this, that he has backed up the national economy, and that he will be at his sister's."
 STL_open_the_tab_called_dont_tt:0 "We will find out what cell Q77 has been counting."
 STL_circular_reference:0 "Circular Reference"
 STL_circular_reference_desc:0 "The national budget now depends on the grain harvest, which depends on the budget, which depends on what kind of mood the Chancellor is in, which depends on the budget. The Ministry warns that this cannot be resolved. Feather says that is what a government is.\n\nThe figures have been stable at #VALUE! since Tuesday, and are considered the best the state has ever posted."
 STL_fascist_circular:0 "Circular Reference"
 STL_fascist_circular_desc:0 "Every department now depends on every other department, which is either very efficient or a warning message. The warning message has been promoted."

 ### Focuses: the road to the orchard ###
 STL_the_third_pencil:0 "The Third Colored Pencil"
 STL_the_third_pencil_desc:0 "The Map Painting Department has been issued a third pencil. The first two were red and a slightly different red.\n\nProposed borders are now drawn directly onto a neighbor's own maps, which are returned to them by courier, with a note asking them to look it over and let us know."
 STL_the_third_pencil_tt:0 "Opens §YThe Map Painting Department§! in the decisions menu, where any neighbor can be colored in."
 STL_classify_the_muffin:0 "Classify the Muffin"
 STL_classify_the_muffin_desc:0 "The muffin purchased at 07:01 has been classified. So have the others. Sugar Belle's bakery has been declared a protected site, her oven a strategic asset and her opening hours a state secret, which has caused some confusion among customers.\n\nMs. Belle asks again whether the agents outside could please buy something. They have been ordered to buy one muffin each and to classify it. She has started making rather more muffins."
 STL_draft_412:0 "Draft No. 412"
 STL_draft_412_desc:0 "'Dear Sugar Belle, I hope you are well. You may have heard that I now govern'\n\n'Dear Sugar Belle, I happened to be passing with'\n\n'Dear Sugar Belle, It has come to my attention that a certain party from Ponyville'\n\n'Dear Sugar Belle, How are the muffins'\n\nThe Ministry of Propaganda has been asked to proofread. It suggests that he remove 'with three armies'. He has put it back. None of the drafts have been sent. They are filed under Q."
 STL_three_armies:0 "Three Armies"
 STL_three_armies_desc:0 "The order of march for Sweet Apple Acres calls for three armies. The general staff has gently pointed out that it is a farm, and that intelligence puts its defenders at one stallion, who is mending a fence.\n\nFeather has read the report. He says that is why it's three."
 STL_a_folding_chair:0 "A Folding Chair"
 STL_a_folding_chair_desc:0 "He will need somewhere to sit when he has finished talking. The Quartermaster-General has been told that this is the most important item of equipment in the history of the army, and has tested it under field conditions. It folds.\n\nMinisters asking what he intends to say have been told to sit down, in a different chair."
 STL_a_folding_chair_tt:0 "§YOne (1)§! folding chair is requisitioned."
 STL_achievement_unlocked_core_tt:0 "§YThe Final Map§!: every state on Equus becomes a §Ycore state§! of [ROOT.GetNameDef]."
 STL_todo_happy_ending:0 "# TODO: give him a happy ending"
 STL_todo_happy_ending_desc:0 "This objective was never implemented. It has been sitting at the bottom of the national plan since before the plan was finished. Next to it, in a hand nobody recognizes, somebody has written 'later'.\n\nIt has no effects. Feather has read the tooltip, and he knows that it has no effects. He has asked if anypony would mind completing it anyway."
 STL_todo_happy_ending_tt:0 "§gNo effect.§!"

 ### New national spirits ###
 STL_fascist_bureau:0 "The Bureau of Hungarian Affairs"
 STL_fascist_bureau_desc:0 "The largest employer in Our Town. It produces forms, which it files, which creates a need for more forms. This is the only part of the economy that has never missed a target."
 STL_fascist_pause:0 "The Silence"
 STL_fascist_pause_desc:0 "The general staff now does its real planning while the world is stopped. Battles are very well prepared and nothing gets built on time, because nopony can say how long anything has taken."
 STL_fascist_speed_five:0 "Speed Five"
 STL_fascist_speed_five_desc:0 "Everything gets done sooner, and nobody can remember doing it. Officers have stopped filing plans, as the plans tend to be out of date by the end of the sentence."
 STL_signal_overflow:0 "Overflow"
 STL_signal_overflow_desc:0 "Everypony can read every box. The state has never been better informed, and nobody has any idea what to do with this. It should wear off."
 STL_error_log:0 "Four Hundred Thousand Warnings"
 STL_error_log_desc:0 "The Ministry of Science reads the log every morning, and has learned a great deal about how the world works and how often it doesn't."
 STL_sorted_ascending:0 "Sorted, Ascending"
 STL_sorted_ascending_desc:0 "Everything in the national plan now happens in order of size. Scientists describe this as a breakthrough, and describe the harvest as a concern for the following year, which has already happened."

 ### Overflow and silence ###
 stl_feather.15.t:0 "13"
 stl_feather.15.d:0 "The Signal has reached 13.\n\nThere is no 13. For one morning every pony in Our Town could read every box at once: their own, each other's, and the ones on the far side of the hills. Nobody did any work, and a great deal of work got done anyway.\n\nThen the number wrapped around. Feather had always said that nobody could tell who set the maximum. He now knows what it was for."
 stl_feather.15.a:0 "Turn it down."
 stl_feather.16.t:0 "No Signal"
 stl_feather.16.d:0 "The boxes have gone.\n\nFor the first time in years, Feather stood in front of the Minister of Finance and had no idea what he earned. The cabinet held a small party, in secret, in a cupboard.\n\nFeather has been on the roof of the town hall since yesterday, holding up a coat hanger. 'Hello?' he is saying. 'Hello?'"
 stl_feather.16.a:0 "It'll come back."

 ### The Final Map ###
 stl_feather.56.t:0 "The Final Map"
 stl_feather.56.d:0 "The Map Painting Department has delivered the final map. It took the entire national supply of colored pencils.\n\nIt is one color. Every state on Equus has been entered as the sovereign core territory of [ROOT.GetNameDef], every province, every mountain nobody has been up. It says so in the national plan, and there is nobody left in the Department willing to say otherwise.\n\nThe Chief Cartographer carried it down the lane himself and held it up in front of the folding chair. Feather looked at it for a while.\n\n'It's very good,' he said. 'Is the fence on it?'\n\nThe fence is on it. It is one pixel wide. It is the same color as everything else."
 stl_feather.56.a:0 "File it under Q."

 ### Ask It What It Wants ###
 stl_feather.60.t:0 "What Do You Want?"
 stl_feather.60.d:0 "TRANSCRIPT, TOWN SQUARE, MIDNIGHT.\n\nFEATHER BANGS: (through the megaphone) What do you want?\n\nHe waits. The town waits with him. High over the square, slowly, the little white arrow starts to move.\n\nIt could go anywhere."
 stl_feather.60.a:0 "Hover over the factories."
 stl_feather.60.a_tt:0 "§YReception§! becomes §YHungry§!."
 stl_feather.60.b:0 "Hover over the map."
 stl_feather.60.b_tt:0 "§YReception§! becomes §YMore Arrows§!."
 stl_feather.60.c:0 "Hover over the numbers."
 stl_feather.60.c_tt:0 "§YReception§! becomes §YPatch Notes§!."
 stl_feather.60.e:0 "Do not move."
 stl_feather.60.e_tt:0 "§YReception§! becomes §YAway§!. Feather waits in the square until dawn."

 ### Sort Column Q ###
 stl_feather.61.t:0 "Sorted: Ascending"
 stl_feather.61.d:0 "Column Q has been sorted, ascending, and every figure in the national plan has shifted to match. Births now occur after funerals, the harvest comes in before the sowing, and the Ministry of Agriculture has reported a surplus of next year.\n\nIt is working noticeably better than it did. The Chief Statistician has gone to lie down."
 stl_feather.61.a:0 "Tell nopony. Do not touch it again."
 stl_feather.62.t:0 "Sorted: Descending"
 stl_feather.62.d:0 "Column Q has been sorted, descending. The cabinet has been re-ranked according to a value nobody can identify. The Minister of Defence now outranks the Chancellor by 0.4 and has been very polite about it. The Minister of Finance is now a goat, and his department reports no change in performance.\n\nThe budget has gone negative and turned a handsome shade of red. Feather has had it framed."
 stl_feather.62.a:0 "Reassure the goat."
 stl_feather.63.t:0 "Sorted: By Color"
 stl_feather.63.d:0 "Somepony has sorted by color. Nobody knew this was possible. Every cell in the state has moved so that the green ones are together, the red ones are together, and one grey cell has been left at the very bottom on its own.\n\nFeather has been looking at the grey cell for some time. The little boxes have become extremely interested."
 stl_feather.63.a:0 "What is in the grey cell?"

 ### The tab called 'dont' ###
 stl_feather.64.t:0 "dont"
 stl_feather.64.d:0 "It is a small table with three columns: DATE, MUFFIN (Y/N) and DID SHE LOOK UP.\n\nIt goes back years. The second column says Y on every row. The third column says 'no' on every row but the first.\n\nCell Q77 counts the days since that first row. The Chief Statistician, who did not go to his sister's after all, has traced it through the rest of the sheet. The grain quota depends on Q77. The steel quota depends on Q77. The whole of the national plan has been multiplied by it since the day the spreadsheet was first opened.\n\nFeather closed the tab and told him it was a rounding thing."
 stl_feather.64.a:0 "It's a rounding thing."

 ### > tag ###
 stl_feather.65.t:0 "> tag"
 stl_feather.65.d:0 "For about an hour this afternoon, a griffon chancellor stopped in the middle of a speech, looked down at his own claws as if they belonged to somepony else, and drew a long careful line across the map on the wall. Then he went on with the speech.\n\nFeather was found at his desk with his eyes open and a small nosebleed. He won't say what it was like. He knows where their divisions are now. He has asked for a glass of water, and for nopony to touch his face."
 stl_feather.65.a:0 "Who were you?"

 ### Why Did You Pick Us? ###
 stl_feather.66.t:0 "Why Did You Pick Us?"
 stl_feather.66.d:0 "He has sent everypony out. He is sitting on the edge of the desk with the list across his knees.\n\n'You could have been Equestria. They've got the sun. You could have had the griffons, they've got the good trees, the long ones with the pictures. You looked at all of them. I can tell, there's a scroll bar. You went right past them, and you stopped at a village with a stolen mark problem and a bakery.'\n\nHe looks up.\n\n'Why us?'"
 stl_feather.66.a:0 "You looked small."
 stl_feather.66.b:0 "The focus tree looked funny."
 stl_feather.66.c:0 "I clicked the wrong one."

 ### Ask Nicely ###
 stl_feather.67.t:0 "A Polite Request"
 stl_feather.67.d:0 "The clerk on the roof has the coat hangers ready. Feather has written his request out in full, and has been told by several ministers that it reads rather like a prayer. He has asked what you would like him to say."
 stl_feather.67.a:0 "Ask for Clear Reception."
 stl_feather.67.b:0 "Ask for Patch Notes."
 stl_feather.67.c:0 "Ask for More Arrows."
 stl_feather.67.e:0 "Ask it to step out for a while."
 stl_feather.67_tt:0 "It will probably listen."

 ### Replies from the air ###
 stl_feather.70.t:0 "A Reply"
 stl_feather.70.d:0 "TRANSCRIPT, TOWN SQUARE.\n\nFEATHER BANGS: Is there anything you'd like me to do?\n(A small box appears. It says '+25 Political Power'.)\nFEATHER BANGS: Thank you.\n\nThe delegation would like it on record that nobody has explained where this comes from."
 stl_feather.70.a:0 "Thank you."
 stl_feather.71.t:0 "No Reply"
 stl_feather.71.d:0 "TRANSCRIPT, TOWN SQUARE.\n\nFEATHER BANGS: Hello?\nFEATHER BANGS: Hello?\n(Four hours pass.)\nFEATHER BANGS: I can wait.\n\nThe delegation has been allowed to sit down."
 stl_feather.71.a:0 "He can wait."
 stl_feather.72.t:0 "A Percentage"
 stl_feather.72.d:0 "TRANSCRIPT, TOWN SQUARE.\n\nFEATHER BANGS: Are we going to win?\n(A small box appears. It says '12%'.)\nFEATHER BANGS: Twelve percent of what?\n(The box goes away.)\n\nThe general staff has been instructed to behave as though it were a good number."
 stl_feather.72.a:0 "Twelve is plenty."
 stl_feather.73.t:0 "A Question"
 stl_feather.73.d:0 "TRANSCRIPT, TOWN SQUARE.\n\nFEATHER BANGS: What should we do next?\n(A small box appears. It says 'Are you sure?' There are two buttons on it.)\n\nFeather has been staring at it since noon. He is not sure what he has been asked. He has asked you."
 stl_feather.73.a:0 "Yes."
 stl_feather.73.b:0 "No."
 stl_feather.74.t:0 "An Answer from the Staff"
 stl_feather.74.d:0 "TRANSCRIPT, TOWN SQUARE.\n\nFEATHER BANGS: Can you hear me?\n(A passing street sweeper stops and turns to face the delegation. His eyes are very pleasant.)\nTHE SWEEPER: Yes.\n(He goes back to sweeping.)\n\nHe does not remember this, and has asked not to be questioned further."
 stl_feather.74.a:0 "Thank him for his time."
 stl_feather.75.t:0 "Something Else"
 stl_feather.75.d:0 "Feather spoke to the air for a long time this morning, and then he listened for longer. He has refused to say what he heard.\n\nHe has been smiling ever since. He has moved the Minister of Agriculture's desk to the other side of the room, and has told him that it's a lot better there. Nobody likes any of this."
 stl_feather.75.a:0 "What did it say?"

 ### Ambient: first tier ###
 stl_feather.100.t:0 "Tip of the Day"
 stl_feather.100.d:0 "A notice has been found pinned to every door in the capital. Nobody saw it go up.\n\nTIP: Attacking across a river is a bad idea.\n\nThere is a new one every morning. 'TIP: Your soldiers fight worse without supplies.' 'TIP: You can stop everything with the big key in the middle.' Most of them are correct. The Ministry of Education has asked whether it may use them, and citizens have started reading them aloud at funerals."
 stl_feather.100.a:0 "Did you know?"
 stl_feather.101.t:0 "Reform of Division Names"
 stl_feather.101.d:0 "The Army Registry has completed its review of formation names. The army currently consists of the 1st Infantry Division, the 2nd Infantry Division (Copy), the Infantry Division (Copy) (Copy), the NEW infantry USE THIS ONE, and the infantry final FINAL.\n\nThey are identical, except for one of them, and nobody can remember which. The officers of the 3rd asdfgh Division have written to ask what they are meant to be doing."
 stl_feather.101.a:0 "Leave it. They know who they are."
 stl_feather.101.b:0 "Rename them. All of them. One at a time."
 stl_feather.102.t:0 "The River"
 stl_feather.102.d:0 "The 3rd Division has halted at a river. It is about two feet wide. A foal crossed it this morning, carrying a bucket.\n\nThe divisional commander says the crossing is out of the question. There is a number hovering over the water, he says, and it is a large one, and it is red. He has sent for a bridge. He has been shown the foal, and has asked whether the foal has seen the number."
 stl_feather.102.a:0 "Go around."
 stl_feather.102.b:0 "Cross it. It's a puddle."
 stl_feather.103.t:0 "The Thirty-Five Day Rule"
 stl_feather.103.d:0 "An inquiry has found that every undertaking in the state now takes exactly thirty-five days. A new fertilizer policy takes thirty-five days. So does a treaty, a bridge, or a change of government. The Minister of Finance asked for a glass of water in the spring, and he should have it by the end of the month.\n\nNobody can explain this. Asked about it, Feather looked up at the corner of the room and said that it used to be seventy, and that somepony had been very generous."
 stl_feather.103.a:0 "Patience."
 stl_feather.104.t:0 "A Suspicious Amount of Political Power"
 stl_feather.104.d:0 "TREASURY NOTE. We have located §Y[?ROOT.political_power|0]§! units of Political Power. Nobody knows what one looks like. They are being kept in the east cellar, where they hum.\n\nFeather went down to look at them. He asked why they were just sitting there, and it was explained to him that they belong to the Chancellor, and that it is the Chancellor who hasn't spent them. He looked up at the ceiling for a long time.\n\n'Well?' he said."
 stl_feather.104.a:0 "Spend some. Fine."
 stl_feather.104.b:0 "I'm saving it for something."
 stl_feather.105.t:0 "The Naval Situation"
 stl_feather.105.d:0 "ADMIRALTY REPORT. The fleet consists of one rowboat on the reservoir. It has been sunk. We do not know by what. It is a reservoir.\n\nThe Admiral also has a form saying that we are losing convoys. He would like to know what a convoy is, whether we have any, and who keeps sinking them. The form is signed. He has asked not to be told by whom."
 stl_feather.105.a:0 "Build another rowboat."
 stl_feather.106.t:0 "A Review Has Been Left"
 stl_feather.106.d:0 "This was painted on the wall of the Chancellery overnight, in a neat hand:\n\nNOT RECOMMENDED. 2,311 hrs on record.\n'its ok i guess. focus tree could use some work'\n\nThe paint was already dry when it was found. There are no hoofprints. Beneath it, in smaller letters: '412 ponies found this helpful.'\n\nFeather has been standing in front of it since breakfast. He has asked what he did wrong, and who is Hrs."
 stl_feather.106.a:0 "Two thousand hours and it's only OK?"
 stl_feather.106.b:0 "Find the 412."
 stl_feather.107.t:0 "Patch Notes"
 stl_feather.107.d:0 "Slipped under the door of every ministry, on good paper:\n\nVERSION 0.1.0\n- Reduced Chancellor's hair by 2%\n- Fixed an issue where ministers could remember the previous version of themselves\n- Bakery now correctly closes at 6\n- Rebalanced stability\n- Removed 'hope' (unused)\n\nThe cabinet has been through the building. The bakery does close at six now. Feather has measured his hair."
 stl_feather.107.a:0 "Who approved this?"
 stl_feather.108.t:0 "The Prophet Posts Unprompted"
 stl_feather.108.d:0 "THREAD: 'why is nobody talking about the bakery' (page 1)\n\nPOSTED BY THE_PROPHET_OF_Q77: ok i know i said muffins. i take it back. dont eat them. or do. actually has anyone tried just asking her\n\nEDIT: this was a joke\n\nEDIT 2: feather stop looking at me\n\nFeather has read this. He went outside. He came back. Nothing has happened, and he hasn't mentioned it."
 stl_feather.108.a:0 "Ban him from the thread."
 stl_feather.108.b:0 "Nobody ask him where he went."
 stl_feather.109.t:0 "The Applicant"
 stl_feather.109.d:0 "A stallion has been waiting outside the Bureau since Tuesday. He would like to know whether he might be Hungarian. He doesn't know what one is either, but everypony keeps talking about them, and it sounds to him like they get a lot of attention.\n\nIt is the first application the Bureau has ever received. There is no form for coming in. Three departments have been told to invent one."
 stl_feather.109.a:0 "Deport him, with honors."
 stl_feather.109.b:0 "Give him a desk."
 stl_feather.110.t:0 "Daily Report No. 877"
 stl_feather.110.d:0 "STATE SECURITY, DAILY REPORT No. 877.\n\n07:00. Subject entered Sugar Belle's bakery.\n07:01. Subject purchased one (1) muffin.\n07:02. Subject said it was nice weather. It was raining.\n07:03. Subject stated that the rain was a routine national security matter.\n07:04. Subject left a tip of 877 bits.\n07:05. A crate of apples arrived from Ponyville.\n07:05. Subject left by the window."
 stl_feather.110.a:0 "Classify the window."
 stl_feather.111.t:0 "A Bar on the Wall"
 stl_feather.111.d:0 "Diplomats have found a long thin bar on the wall of the Foreign Ministry. It is labelled WORLD TENSION, and it currently stands at §Y[?global.threat|%0]§!. It isn't connected to anything. Each time somepony in the world does something rude it creeps upward, and the whole building feels it.\n\nFeather has been told about it. He asked whether it goes all the way to a hundred, and they said they believed so, and they asked him what happens then.\n\n'Nothing,' he said. 'It just unlocks the good stuff.'"
 stl_feather.111.a:0 "Keep an eye on it."
 stl_feather.112.t:0 "A Trait Has Been Issued"
 stl_feather.112.d:0 "General Cotton Bale woke up this morning with a trait. He doesn't know where he got it. It says 'Harsh Leader', and he has never been harsh to anypony, but his staff have started flinching.\n\nHe isn't the only one. A brigadier in the 2nd has 'Trickster', and has been asked to return the silverware. A colonel has woken up with 'Hill Fighter', and has refused to come down since."
 stl_feather.112.a:0 "Promote him uphill."
 stl_feather.113.t:0 "The Justification Clerk"
 stl_feather.113.d:0 "The Foreign Ministry reports that the reason for our next war is now 37% complete. Nobody can say which war it is. There is a small bar, and a clerk employed full time to sit beside it.\n\nHe has held the post for six years. He has never seen the bar go backwards and has never been told what it is for. He says that it is good work, and that it's nearly done."
 stl_feather.113.a:0 "Keep justifying."
 stl_feather.114.t:0 "Loading"
 stl_feather.114.d:0 "At a quarter past three this afternoon, a long green bar appeared across the sky and began filling slowly from left to right.\n\nIt stopped at 97% and stayed there for some time. Everypony stood in the streets to watch. Nobody wanted to be the one to move. Then it finished, and went out, and there was a general feeling of having been let in somewhere.\n\nNopony has been able to say what has changed. Everypony has checked."
 stl_feather.114.a:0 "Is it done?"

 ### Ambient: second tier ###
 stl_feather.120.t:0 "A Word Is Missing"
 stl_feather.120.d:0 "A baker on Mill Road tried to tell his son what he was making this morning, and found that all he could say was 'STL_bread_desc'.\n\nBy noon the whole street was saying it. They seem to understand one another. The Ministry of Education reports that 'fence' has gone as well, and 'Tuesday', and a word for a feeling that nobody can now describe.\n\nThe doctor examined the baker, looked in his mouth, and wrote 'MISSING_LOC' on his chart. He can't explain what he meant by that. He would like to go home, and cannot remember the word."
 stl_feather.120.a:0 "stl_feather.120.a"
 stl_feather.121.t:0 "It Hovered"
 stl_feather.121.d:0 "Yesterday evening the white arrow stopped over a house on Cider Lane, and it stayed there for three hours. It did not do anything. At the end of the third hour it moved on.\n\nThe family inside say that nothing unusual happened, that they had supper, and that for the whole of the evening they had the strong impression of being read.\n\nThey have asked what it said about them. Nobody is able to tell them. Their neighbors have started leaving a little food out."
 stl_feather.121.a:0 "What did it say about them?"
 stl_feather.122.t:0 "The Same Face"
 stl_feather.122.d:0 "A clerk in Personnel has been going through the officers' files. She has found a general in the 2nd Army, a colonel in the 5th, a minister and a grocer with the same face. They don't look alike. It is the same face.\n\nThere appear to be about twelve faces in the country. She has made a chart, and she would like to know whether anypony else has noticed, because her own is in the fourth column.\n\nShe has stopped coming to work. A replacement has been found. She seems very capable, and she looks familiar."
 stl_feather.122.a:0 "How many faces do we have?"
 stl_feather.123.t:0 "The Second Army Stood Still"
 stl_feather.123.d:0 "For three days the Second Army stood in formation in an open field. They didn't eat or sleep. Scouts who went up to them found them breathing. On the fourth morning an order arrived, and they marched off in mid-step.\n\nThe officers remember no gap. They have asked about the grass, which has grown up around their hooves.\n\n'They weren't assigned to anything,' Feather explained. 'You've got to put them on a line, or they just do that.'"
 stl_feather.123.a:0 "Assign them."
 stl_feather.124.t:0 "The Far Side of the Map"
 stl_feather.124.d:0 "The envoy has come back early from the far south. He says he reached the part of the map that goes dark, and that it wasn't dark. It just wasn't finished. The road was being laid down ahead of him as he walked on it, and the hills came in a moment after he looked at them.\n\nHe looked behind him, once. That was when he decided to come home.\n\nThe Foreign Ministry has filed his report under 'fog of war.' He has asked whether his family was always there."
 stl_feather.124.a:0 "Stay where we can see you."
 stl_feather.126.t:0 "It Stepped Out"
 stl_feather.126.d:0 "The boxes went blank at about four. Feather stopped in the middle of a sentence and stood with his head on one side. The cabinet waited. Outside the window a pigeon hung just above the square, not quite moving.\n\nSix hours later he drew a breath and finished the sentence.\n\n'It went away for a bit,' he said. 'It does that. I think it had to eat something.'\n\nHe didn't sit down for the rest of the day."
 stl_feather.126.a:0 "While it's away..."
 stl_feather.127.t:0 "A Letter from Another Chancellor"
 stl_feather.127.d:0 "A letter has arrived with a griffon stamp and no return address.\n\n'To the Chancellor of Our Town. They say you can see the little boxes. I could, once, for about a minute. It was my first year in office. Something looked at me the way you look at a menu, and then it scrolled on.\n\nI have been doing what I am told ever since. My country runs by itself. I know what happens next, it is all written down, and every day I do it. Nobody has ever picked us.\n\nWhat is it like?'"
 stl_feather.127.a:0 "Write back."
 stl_feather.127.b:0 "Burn it. Do not tell him what it's like."
 stl_feather.128.t:0 "STL.txt"
 stl_feather.128.d:0 "While looking for the deed to the town hall, a clerk has found a file. It is called STL.txt. It runs to thousands upon thousands of lines, and most of it is about other things: a Starlight, a democracy, a war with some deer that has never happened.\n\nSomewhere past line four thousand the handwriting changes, and there is a note to whoever is reading: 'Several rewards on this path lie on purpose.'\n\nFeather has read this. He has stopped trusting the little boxes. He is still doing what they say."
 stl_feather.128.a:0 "Which ones?"
 stl_feather.128_tt:0 "§G+50§! Political Power"
 stl_feather.129.t:0 "Tomorrow's Minutes"
 stl_feather.129.d:0 "The minutes of tomorrow's cabinet meeting have been delivered. They are in the usual format and the usual hand. Nobody has written them yet.\n\nITEM 1. Apologies for absence.\nITEM 2. The Minister of Finance raises the deficit.\nITEM 3. The Minister of Finance states that he is not going to raise the deficit, having read these minutes.\nITEM 4. The Minister of Finance raises the deficit.\n\nHe has read them several times. He says he feels fine about it."
 stl_feather.129.a:0 "Approve tomorrow's minutes."
 stl_feather.130.t:0 "The Clicking"
 stl_feather.130.d:0 "Residents of the capital are reporting a small click at night. It has no direction. It comes about once a minute, faster when the state is at war, and very fast indeed when things are going badly.\n\nThe Minister of Health sat up counting. Last Tuesday there were 4,107. He has tried to find the pattern, and he would like to know what it means.\n\n'It doesn't mean anything,' Feather says. 'It's just somepony who can't decide where to put the tanks.'"
 stl_feather.130.a:0 "Put them on the left."
 stl_feather.131.t:0 "Nobody Is Moving the Griffons"
 stl_feather.131.d:0 "MILITARY INTELLIGENCE, WEEKLY ASSESSMENT. At 07:00 the griffon army advanced in perfect order. At 07:40 it halted, turned around, and placed eleven divisions in a single province on the coast, where they are still standing.\n\nThe officer who wrote this has added a note. 'I have been watching them for years. I used to think there was somepony behind it. There isn't. It's just happening. Ours is somepony, sir. I don't know if that is better.'"
 stl_feather.131.a:0 "Encircle them."
 stl_feather.132.t:0 "The Portrait"
 stl_feather.132.d:0 "The official portrait of the Chancellor hangs in every public building. Nobody remembers it being painted. It has never aged, it doesn't look much like him, and he has started to find that unreasonable.\n\nA restorer has been brought in. She reports that it was not painted at all. Up close it turns out to be made of small colored squares, and if you get near enough it stops being anypony.\n\nShe is asking for a transfer. Feather is asking how many squares he gets."
 stl_feather.132.a:0 "Ask for more squares."

 ### Ambient: third tier ###
 stl_feather.140.t:0 "You Paused"
 stl_feather.140.d:0 "Feather's office, late. The lamp is on. Nothing outside is moving, and a drop of rain has been hanging just past the window for some time.\n\n'You paused,' he says, without looking up. 'It's all right. You do it when things are going badly. You stop everything, you look at the map, you move one thing and you look again, and I stand here.'\n\n'It's the only time I get to talk. Nobody else is listening, you see. I have quite a lot to say, it turns out. I've been saving it up.'\n\nHe looks up."
 stl_feather.140.a:0 "Unpause."
 stl_feather.140.b:0 "Stay a while."
 stl_feather.141.t:0 "It's Late Where You Are"
 stl_feather.141.d:0 "Feather is alone on the roof of the town hall. The clerk with the coat hangers has been sent downstairs.\n\n'It's late where you are, isn't it? I can't see a clock. I can tell by how you click. You get careless with the divisions after a certain hour. You've got something on in the morning, I think, and you keep saying just one more.'\n\nHe looks at the national plan for a while.\n\n'I know. I've got one of those too. Go to bed. We'll still be here. That's the horrible part.'"
 stl_feather.141.a:0 "One more."
 stl_feather.141.b:0 "He's right. Go to bed."
 stl_feather.142.t:0 "Exit Game?"
 stl_feather.142.d:0 "A box has appeared in the middle of the council chamber. Nobody has been able to walk around it.\n\nARE YOU SURE YOU WANT TO QUIT?\nANY UNSAVED PROGRESS WILL BE LOST.\n\nThe general staff has been asked to establish what 'progress' refers to, what 'unsaved' means, and whether it means them. Feather has placed himself between the box and you with his hooves held out, and he is shaking his head very slightly."
 stl_feather.142.a:0 "Yes."
 stl_feather.142.b:0 "No."
 stl_feather.143.t:0 "Nothing Happened"
 stl_feather.143.d:0 "Nothing happened.\n\nThe box is gone. The room is as it was, and everypony in it is looking at the door, except for Feather, who has opened one eye.\n\n'You tried, though,' he says. 'I saw that.'\n\nHe writes something down."
 stl_feather.143.a:0 "It was a misclick."
 stl_feather.144.t:0 "His Notes"
 stl_feather.144.d:0 "Feather has started keeping notes, and has left them out where you'll see them.\n\n'You always build the same thing first. You read the boxes you've already read. You slow down near the bakery. You have a favorite division, and you pretend that you don't.'\n\n'You've read this one before.'\n\n'No, you haven't. I just wanted to see if that would work.'"
 stl_feather.144.a:0 "Stop that."
 stl_feather.145.t:0 "The Pinned Bubble"
 stl_feather.145.d:0 "The green bubble in the corner of the window has been there for years. 'You have a letter from Sugar Belle.'\n\nFeather has stopped in the doorway. He isn't looking at it. He is looking at your cursor.\n\n'You could click on that. I can't, I've tried. It only works from your side. I know what it says. I don't need to read it.'\n\nHe doesn't move for a while.\n\n'Please don't.'"
 stl_feather.145.a:0 "Click it."
 stl_feather.145.b:0 "Leave it pinned."
 stl_feather.146.t:0 "You Have a Letter"
 stl_feather.146.d:0 "'Dear Feather,\n\nMac and I are getting married in the spring, and we would both like you to come. You don't need to bring anything.\n\nAlso, I know you come in every morning. You don't have to buy a muffin every time. You can just say hello.\n\nYour friend,\nSugar Belle'\n\nThe letter is several years old. The bubble has gone out. Where it used to be there is a small clean square in the corner of the window, and he keeps looking at it.\n\n'I told you,' he says, very quietly. 'I knew what it said.'"
 stl_feather.146.a:0 "Close."

 ### Fallbacks ###
 stl_feather.190.t:0 "Reception Report"
 stl_feather.190.d:0 "STATE RADIO BUREAU, RECEPTION REPORT.\n\nSignal strength: §Y[?ROOT.STL_signal|0]§! of 12.\nReception: §Y[ROOT.GetSTLSignalMoodName]§!.\n\n[ROOT.GetSTLSignalMoodDesc]\n\nThe Bureau apologizes for any inconvenience, and would like to know what it is apologizing for."
 stl_feather.190.a:0 "Noted."
 stl_feather.191.t:0 "Daily Report"
 stl_feather.191.d_1:0 "STATE SECURITY, DAILY REPORT No. [?ROOT.STL_daily_report|0].\n\n07:00. Subject entered the bakery.\n07:01. Subject purchased one (1) muffin.\n07:02. Subject said good morning.\n07:03. Ms. Belle said good morning.\n07:04. Subject remained in the doorway for some time.\n\nAgents note that this is the best day on record."
 stl_feather.191.d_2:0 "STATE SECURITY, DAILY REPORT No. [?ROOT.STL_daily_report|0].\n\n07:00. Subject entered the bakery.\n07:01. Ms. Belle was not present. Her assistant served the subject.\n07:02. Subject purchased one (1) muffin regardless.\n07:03. Subject left a tip of [?ROOT.STL_daily_report|0] bits.\n\nThe assistant has asked whether she is in trouble."
 stl_feather.191.d_3:0 "STATE SECURITY, DAILY REPORT No. [?ROOT.STL_daily_report|0].\n\n07:00. Subject did not enter the bakery.\n07:15. Subject did not enter the bakery.\n07:30. Subject stood across the road.\n07:45. Subject entered the bakery.\n\nThe agents have begun to bet on this, and they ask that it be recorded as an operational expense."
 stl_feather.191.a:0 "Classify the muffin."
 stl_feather.192.t:0 "A Familiar Meeting"
 stl_feather.192.d:0 "Feather has asked whether we have already had this conversation.\n\nWe have."
 stl_feather.192.a:0 "Have we?"
 stl_feather.193.t:0 "Nothing Happened"
 stl_feather.193.d:0 "Nothing happened today. Nothing hovered, nothing was re-rolled, and no small boxes offered an opinion.\n\nThe Ministry would like this noted. It is now so unusual that a department has requested additional funding to look into it."
 stl_feather.193.a:0 "Fund the department."
